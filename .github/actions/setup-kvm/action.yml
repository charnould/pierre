name: Setup KVM
description: Enable /dev/kvm and install host dependencies for microVM builds

runs:
  using: composite
  steps:
    - name: Enable KVM
      shell: bash
      run: |
        sudo modprobe kvm || true
        sudo modprobe kvm_intel || sudo modprobe kvm_amd || true
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules || true
        sudo udevadm trigger --name-match=kvm || true
        if [ ! -e /dev/kvm ]; then
          sudo mknod /dev/kvm c 10 232
        fi
        sudo chmod 666 /dev/kvm
        test -r /dev/kvm
        test -w /dev/kvm

    - name: Install host dependency
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq libvirglrenderer1
