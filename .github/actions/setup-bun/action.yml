name: Setup Bun
description: Install Bun from config/.bun-version and optionally restore cache and install dependencies

inputs:
  install:
    description: Whether to restore the Bun cache and run bun install --frozen-lockfile
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: config/.bun-version

    - if: inputs.install == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-

    - if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile
