name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format:
    name: Format (bun fmt)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
        with:
          install: 'false'
      - run: bun fmt --check

  lint:
    name: Lint (oxlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun oxlint

  knip:
    name: Dead code (knip)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Dead code & exports
        run: bun knip
      - name: Production dependencies
        run: bun knip:production

  typecheck:
    name: Typecheck (bun check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun check

  test-core:
    name: Tests · Core
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun run test:core

  test-server:
    name: Tests · Server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Ensure ImageMagick
        run: command -v magick >/dev/null || command -v convert >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
      - run: bun run test:server

  test-desktop:
    name: Tests · Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun run test:desktop

  test-e2e:
    name: Tests · Server E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Ensure ImageMagick
        run: command -v magick >/dev/null || command -v convert >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
      - run: bun run test:e2e
        env:
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

  build-binaries:
    name: Build · Server & CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Build & smoke server
        run: bash server/utils/build-release.sh .
      - name: Build & smoke CLI
        run: |
          bun build --compile --target=bun-linux-x64 --no-compile-autoload-dotenv \
            cli/src/main.ts --outfile "$RUNNER_TEMP/pierre-cli"
          test "$("$RUNNER_TEMP/pierre-cli" --version)" = "cli-$(jq -r .version cli/package.json)"
