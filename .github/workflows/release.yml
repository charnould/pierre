name: Release

on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-windows:
    if: ${{ !contains(github.event.release.tag_name, '-') && github.event.release.tag_name != 'microvm' }}
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      desktop_changed: ${{ steps.check.outputs.desktop_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Check desktop changes and verify version
        id: check
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Desktop release tag must be an exact semantic version"
            exit 1
          fi
          PKG_VERSION=$(node -p "require('./desktop/package.json').version")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Release tag $TAG does not match desktop/package.json version $PKG_VERSION"
            exit 1
          fi

          PREV=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | grep -A1 "^${TAG}$" | tail -1 || true)
          if [ -z "$PREV" ] || ! git diff --quiet "$PREV" "$TAG" -- desktop/; then
            echo "desktop_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify GitHub release is published
        if: steps.check.outputs.desktop_changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          gh release view "$TAG" --json isDraft | jq -e '.isDraft == false'
          gh release edit "$TAG" --title "desktop-$TAG" --prerelease=false

      - uses: oven-sh/setup-bun@v2
        if: steps.check.outputs.desktop_changed == 'true'

      - name: Publish Windows
        if: steps.check.outputs.desktop_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun install --frozen-lockfile
          bun --filter "@pierre/desktop" publish -- --platform=win32 --arch=x64

  release-macos:
    needs: release-windows
    if: needs.release-windows.outputs.desktop_changed == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Publish macOS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun install --frozen-lockfile
          bun --filter "@pierre/desktop" publish -- --platform=darwin --arch=arm64

  # The executable needs glibc 2.17 and libonnxruntime.so.1 needs 2.28,
  # both older than Debian 12, so ubuntu-latest is enough.
  # microvm is a fixed tag. carl-* carries the model, not a PIERRE version.
  release-server:
    if: ${{ startsWith(github.event.release.tag_name, 'server-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Verify version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#server-}"
          PKG=$(node -p "require('./server/package.json').version")
          if [ "$VERSION" != "$PKG" ]; then
            echo "Release tag $TAG does not match server/package.json version $PKG"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2

      - name: Build the server executable
        run: |
          bun install --frozen-lockfile --filter @pierre/server
          cd server
          # oxfmt mentions optional Prettier plugins it never loads for Markdown.
          stub() {
            local name="$1"
            local dir="../node_modules/$name"
            mkdir -p "$dir"
            printf '%s\n' '{"type":"module"}' > "$dir/package.json"
            printf '%s\n' 'export default {}' > "$dir/index.js"
          }
          stub @prettier/plugin-oxc
          stub @prettier/plugin-hermes
          stub prettier-plugin-astro
          stub prettier-plugin-marko
          stub @zackad/prettier-plugin-twig
          stub @prettier/plugin-pug
          stub @shopify/prettier-plugin-liquid
          bun build --compile --target=bun \
            --no-compile-autoload-dotenv \
            --asset ./assets \
            --asset ./knowledge \
            --asset ./utils/automations \
            ./serve.ts --outfile ../pierre
          find ../node_modules -path '*/napi-v6/linux/x64/libonnxruntime.so.1' -exec cp {} ../libonnxruntime.so.1 \;
          test -s ../pierre
          test -s ../libonnxruntime.so.1

      - name: Verify server release bundle
        run: |
          TAG="${{ github.event.release.tag_name }}"
          test -s pierre
          test -s libonnxruntime.so.1
          test "$(./pierre --version)" = "$TAG"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            pierre libonnxruntime.so.1 \
            --clobber
