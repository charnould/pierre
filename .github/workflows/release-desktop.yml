name: Release desktop

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches desktop version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./desktop/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match desktop/package.json version $PKG_VERSION"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2

      - name: Install and publish Windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd desktop
          bun install --frozen-lockfile
          bun run publish -- --platform=win32 --arch=x64

  release-macos:
    needs: release-windows
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install and publish macOS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd desktop
          bun install --frozen-lockfile
          bun run publish -- --platform=darwin --arch=arm64
