name: MicroVM

on:
  pull_request:
    branches: [master]
    paths:
      - server/microvm/**
      - .github/workflows/check-microvm.yml
      - .github/actions/setup-kvm/**
  workflow_dispatch:

concurrency:
  group: microvm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  linux-amd64:
    name: Build & smoke (linux-amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Server version bump
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          BEFORE=$(git show "$BASE:server/package.json" | jq -r .version)
          AFTER=$(jq -r .version server/package.json)
          if ! [[ "$AFTER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Server version must be an exact semantic version."
            exit 1
          fi
          if [ "$BEFORE" = "$AFTER" ] || \
            [ "$(printf '%s\n' "$BEFORE" "$AFTER" | sort -V | awk 'NR == 2')" != "$AFTER" ]; then
            echo "Changes under server/microvm require a greater server/package.json version."
            exit 1
          fi

      - uses: ./.github/actions/setup-kvm

      - name: Build and smoke Linux image
        run: bash server/microvm/scripts/build.sh linux-amd64
