name: Release CLI

on:
  push:
    branches: [master]
    paths:
      - cli/package.json
  workflow_dispatch:

concurrency:
  group: release-cli
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      ref: ${{ steps.release.outputs.ref }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Reconcile release state
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun config/release.ts prepare cli

  release:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REF: ${{ needs.prepare.outputs.ref }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          path: source

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Build CLI artifacts
        working-directory: source
        run: |
          bun install --frozen-lockfile --filter @pierre/cli
          bun --filter @pierre/cli typecheck
          bun test cli/tests
          mkdir -p cli/dist
          bun build --compile --target=bun-linux-x64 --no-compile-autoload-dotenv \
            cli/src/main.ts --outfile cli/dist/pierre-cli-linux-x64
          sed "s/__CLI_TAG__/$TAG/g" cli/scripts/install.sh > cli/dist/install.sh
          grep -qx "TAG=$TAG" cli/dist/install.sh
          chmod 755 cli/dist/pierre-cli-linux-x64 cli/dist/install.sh
          test "$(./cli/dist/pierre-cli-linux-x64 --version)" = "$TAG"
          cd cli/dist
          sha256sum pierre-cli-linux-x64 install.sh > checksums.txt

      - name: Publish
        run: |
          bun config/release.ts publish cli "$REF" source/cli/dist

      - name: Smoke test published installer
        run: |
          mkdir -p "$RUNNER_TEMP/pierre-bin"
          sudo env \
            PIERRE_BOOTSTRAP_ONLY=1 \
            PIERRE_CLI_DEST="$RUNNER_TEMP/pierre-bin/pierre" \
            TAG="$TAG" \
            bash -c 'curl -fsSL --retry 12 --retry-delay 5 "https://github.com/charnould/pierre/releases/download/$TAG/install.sh" | sh'
          test "$("$RUNNER_TEMP/pierre-bin/pierre" --version)" = "$TAG"
