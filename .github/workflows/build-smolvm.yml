name: Build smolmachine

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    name: Build (AMD64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install smolvm dependencies
        run: sudo apt-get install -y libvirglrenderer1

      - name: Install smolvm
        run: curl -sSL https://smolmachines.com/install.sh | bash -s -- --version 1.0.4

      - name: Build smolmachine
        run: bash config/build-smolvm.sh

      - name: Upload AMD64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: smolmachine-amd64
          path: |
            config/smolvm/pierre-amd64
            config/smolvm/pierre-amd64.smolmachine
          retention-days: 7
